<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a14"/>
      <stop offset="100%" stop-color="#151024"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#4a00e0"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f80759"/>
      <stop offset="100%" stop-color="#bc4e9c"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" rx="16" fill="url(#bg)"/>

  <!-- Diagram Title -->
  <text x="500" y="50" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="24" fill="#ffffff" text-anchor="middle">System Architecture &amp; Notification Pipeline</text>
  <text x="500" y="80" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="14" fill="#9a95be" text-anchor="middle">From AI Agent Task execution to Windows 11 Action Center Toasts</text>

  <!-- Node 1: AI Agent -->
  <g transform="translate(60, 160)">
    <rect width="240" height="180" rx="14" fill="#1b1531" stroke="url(#boxGrad1)" stroke-width="2"/>
    <text x="120" y="40" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#ffffff" text-anchor="middle">AI Agent Layer</text>
    <text x="120" y="70" font-family="'Segoe UI', sans-serif" font-size="13" fill="#b0abd4" text-anchor="middle">• Antigravity / Claude / GPT</text>
    <text x="120" y="95" font-family="'Segoe UI', sans-serif" font-size="13" fill="#b0abd4" text-anchor="middle">• Monitors Background Tasks</text>
    <text x="120" y="120" font-family="'Segoe UI', sans-serif" font-size="13" fill="#b0abd4" text-anchor="middle">• Evaluates Pct Milestones (10%)</text>
    <rect x="30" y="135" width="180" height="30" rx="6" fill="#8a2be2" opacity="0.4"/>
    <text x="120" y="155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Triggers PowerShell Call</text>
  </g>

  <!-- Connector Line 1 -->
  <path d="M300,250 L370,250" stroke="#8a2be2" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="370,245 380,250 370,255" fill="#8a2be2"/>

  <!-- Node 2: PowerShell BurntToast -->
  <g transform="translate(380, 160)">
    <rect width="240" height="180" rx="14" fill="#1b1531" stroke="url(#boxGrad2)" stroke-width="2"/>
    <text x="120" y="40" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#ffffff" text-anchor="middle">BurntToast Engine</text>
    <text x="120" y="70" font-family="'Segoe UI', sans-serif" font-size="13" fill="#b0abd4" text-anchor="middle">• Imports BurntToast Module</text>
    <text x="120" y="95" font-family="'Segoe UI', sans-serif" font-size="13" fill="#b0abd4" text-anchor="middle">• Attaches Custom AppLogo</text>
    <text x="120" y="120" font-family="'Segoe UI', sans-serif" font-size="13" fill="#b0abd4" text-anchor="middle">• (U:\Pictures\Icons\unicorn.jpg)</text>
    <rect x="30" y="135" width="180" height="30" rx="6" fill="#0072ff" opacity="0.4"/>
    <text x="120" y="155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">WinRT Toast API Call</text>
  </g>

  <!-- Connector Line 2 -->
  <path d="M620,250 L690,250" stroke="#00c6ff" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="690,245 700,250 690,255" fill="#00c6ff"/>

  <!-- Node 3: Windows Action Center -->
  <g transform="translate(700, 160)">
    <rect width="240" height="180" rx="14" fill="#1b1531" stroke="url(#boxGrad3)" stroke-width="2"/>
    <text x="120" y="40" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#ffffff" text-anchor="middle">Windows 11 Toasts</text>
    <text x="120" y="70" font-family="'Segoe UI', sans-serif" font-size="13" fill="#b0abd4" text-anchor="middle">• Visual Toast Popups</text>
    <text x="120" y="95" font-family="'Segoe UI', sans-serif" font-size="13" fill="#b0abd4" text-anchor="middle">• Custom Unicorn Icon</text>
    <text x="120" y="120" font-family="'Segoe UI', sans-serif" font-size="13" fill="#b0abd4" text-anchor="middle">• Sound &amp; Action Center</text>
    <rect x="30" y="135" width="180" height="30" rx="6" fill="#f80759" opacity="0.4"/>
    <text x="120" y="155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">User Visual Feedback</text>
  </g>

  <!-- Bottom Legend -->
  <text x="500" y="420" font-family="'Segoe UI', sans-serif" font-size="13" fill="#757099" text-anchor="middle">Non-blocking background process • Real-time progress updates • Universal AI skill integration</text>
</svg>

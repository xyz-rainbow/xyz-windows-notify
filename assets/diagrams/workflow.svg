<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500">
  <defs>
    <!-- Background -->
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090714"/>
      <stop offset="50%" stop-color="#120c24"/>
      <stop offset="100%" stop-color="#07050d"/>
    </linearGradient>

    <!-- Phase Gradients -->
    <linearGradient id="phase1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <linearGradient id="phase2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="phase3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="phase4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="wfShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="500" rx="20" fill="url(#wfBg)"/>

  <!-- Subtle Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0,100 H1100 M0,200 H1100 M0,300 H1100 M0,400 H1100"/>
    <path d="M150,0 V500 M300,0 V500 M450,0 V500 M600,0 V500 M750,0 V500 M900,0 V500 M1050,0 V500"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(550, 48)" text-anchor="middle">
    <rect x="-170" y="-18" width="340" height="26" rx="13" fill="#1b1233" stroke="#3b2b63" stroke-width="1"/>
    <text x="0" y="-1" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#00f2fe" letter-spacing="1.5">NOTIFICATION LIFECYCLE &amp; MILESTONES</text>
    <text x="0" y="30" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="23" fill="#ffffff">Step-by-Step AI Notification Workflow</text>
  </g>

  <!-- 4 Step Columns -->

  <!-- STEP 1: INITIALIZE & ICON RESOLVE -->
  <g transform="translate(40, 125)" filter="url(#wfShadow)">
    <rect width="235" height="300" rx="14" fill="#140e26" stroke="#9333ea" stroke-width="1.8"/>
    
    <!-- Step Badge Circle -->
    <circle cx="34" cy="34" r="18" fill="url(#phase1Grad)"/>
    <text x="34" y="40" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle">01</text>
    
    <text x="62" y="32" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#ffffff">INIT &amp; ICON SELECTION</text>
    <text x="62" y="48" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#a49ecc">Task Launch Phase</text>

    <!-- Inner Description -->
    <g transform="translate(16, 75)">
      <text x="0" y="14" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5" fill="#c77dff">AI Assessment:</text>
      <text x="0" y="32" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• Scans task scope &amp; files</text>
      <text x="0" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• Matches domain context</text>
      <text x="0" y="64" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• Selects or suggests new icon</text>

      <rect x="0" y="85" width="203" height="52" rx="7" fill="#201138" stroke="#4a1d7a" stroke-width="1"/>
      <text x="8" y="105" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#e9d5ff">🚀 Toast: Task Started</text>
      <text x="8" y="123" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a49ecc">"Backup / Build initiated..."</text>

      <rect x="0" y="150" width="203" height="42" rx="6" fill="#180c29"/>
      <text x="8" y="167" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c77dff">Default: <tspan fill="#ffffff">assets/unicorn.jpg</tspan></text>
      <text x="8" y="182" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7d78a1">Or custom / generated icon</text>
    </g>
  </g>

  <!-- Connector 1-2 -->
  <g transform="translate(280, 275)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#9333ea" stroke-width="2.5"/>
    <polygon points="20,-4 26,0 20,4" fill="#9333ea"/>
  </g>

  <!-- STEP 2: MILESTONE MONITORING -->
  <g transform="translate(310, 125)" filter="url(#wfShadow)">
    <rect width="235" height="300" rx="14" fill="#140e26" stroke="#00f2fe" stroke-width="1.8"/>
    
    <!-- Step Badge Circle -->
    <circle cx="34" cy="34" r="18" fill="url(#phase2Grad)"/>
    <text x="34" y="40" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle">02</text>
    
    <text x="62" y="32" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#ffffff">PROGRESS MILESTONES</text>
    <text x="62" y="48" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#a49ecc">Real-Time Telemetry</text>

    <!-- Inner Description -->
    <g transform="translate(16, 75)">
      <text x="0" y="14" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5" fill="#38bdf8">Incremental Steps (%):</text>
      <text x="0" y="32" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• Evaluates step percentages</text>
      <text x="0" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• 10% • 25% • 50% • 75% • 90%</text>
      <text x="0" y="64" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• Non-blocking background toast</text>

      <rect x="0" y="85" width="203" height="60" rx="7" fill="#08253a" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="103" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#e0f2fe">📊 Progress: 50%</text>
      <text x="8" y="119" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7dd3fc">1,024 MB of 2,048 MB</text>
      <!-- Mini progress bar -->
      <rect x="8" y="128" width="187" height="5" rx="2.5" fill="#0e3f61"/>
      <rect x="8" y="128" width="94" height="5" rx="2.5" fill="#00f2fe"/>

      <rect x="0" y="155" width="203" height="37" rx="6" fill="#041b2b"/>
      <text x="8" y="171" font-family="'Segoe UI', sans-serif" font-size="10" fill="#38bdf8">Sound: <tspan fill="#ffffff">'Default' / silent</tspan></text>
      <text x="8" y="185" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#7d78a1">Quiet non-intrusive updates</text>
    </g>
  </g>

  <!-- Connector 2-3 -->
  <g transform="translate(550, 275)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#00f2fe" stroke-width="2.5"/>
    <polygon points="20,-4 26,0 20,4" fill="#00f2fe"/>
  </g>

  <!-- STEP 3: EXCEPTION / WARNING -->
  <g transform="translate(580, 125)" filter="url(#wfShadow)">
    <rect width="215" height="300" rx="14" fill="#140e26" stroke="#f59e0b" stroke-width="1.8"/>
    
    <!-- Step Badge Circle -->
    <circle cx="34" cy="34" r="18" fill="url(#phase3Grad)"/>
    <text x="34" y="40" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle">03</text>
    
    <text x="62" y="32" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#ffffff">EXCEPTION / ALERT</text>
    <text x="62" y="48" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#a49ecc">Error Interception</text>

    <!-- Inner Description -->
    <g transform="translate(14, 75)">
      <text x="0" y="14" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5" fill="#fbbf24">Anomaly Handling:</text>
      <text x="0" y="32" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• Subprocess non-zero exit</text>
      <text x="0" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• Disk full / timeout detection</text>
      <text x="0" y="64" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• High-priority audio alert</text>

      <rect x="0" y="85" width="187" height="52" rx="7" fill="#2d1d07" stroke="#b45309" stroke-width="1"/>
      <text x="8" y="105" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#fef3c7">⚠️ Warning / Exception</text>
      <text x="8" y="123" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fde68a">"Disk space low on volume"</text>

      <rect x="0" y="150" width="187" height="42" rx="6" fill="#201305"/>
      <text x="8" y="167" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fbbf24">Sound: <tspan fill="#ffffff">'Alarm2' / 'Default'</tspan></text>
      <text x="8" y="182" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#7d78a1">Instant user alert</text>
    </g>
  </g>

  <!-- Connector 3-4 -->
  <g transform="translate(800, 275)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#f59e0b" stroke-width="2.5"/>
    <polygon points="20,-4 26,0 20,4" fill="#f59e0b"/>
  </g>

  <!-- STEP 4: COMPLETION (100%) -->
  <g transform="translate(825, 125)" filter="url(#wfShadow)">
    <rect width="235" height="300" rx="14" fill="#140e26" stroke="#00ff87" stroke-width="1.8"/>
    
    <!-- Step Badge Circle -->
    <circle cx="34" cy="34" r="18" fill="url(#phase4Grad)"/>
    <text x="34" y="40" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15" fill="#000000" text-anchor="middle">04</text>
    
    <text x="62" y="32" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#ffffff">COMPLETE (100%)</text>
    <text x="62" y="48" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#a49ecc">Summary &amp; Metrics</text>

    <!-- Inner Description -->
    <g transform="translate(16, 75)">
      <text x="0" y="14" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5" fill="#4ade80">Success Verification:</text>
      <text x="0" y="32" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• 100% data transferred</text>
      <text x="0" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• Elapsed time calculation</text>
      <text x="0" y="64" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8f8ab0">• Final audit &amp; log summary</text>

      <rect x="0" y="85" width="203" height="52" rx="7" fill="#063821" stroke="#059669" stroke-width="1"/>
      <text x="8" y="105" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#dcfce7">✅ Task Complete (100%)</text>
      <text x="8" y="123" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac">"2,100 files verified and saved"</text>

      <rect x="0" y="150" width="203" height="42" rx="6" fill="#032415"/>
      <text x="8" y="167" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4ade80">Action Center: <tspan fill="#ffffff">Archived</tspan></text>
      <text x="8" y="182" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#7d78a1">Ready in Windows Notification Hub</text>
    </g>
  </g>

  <!-- Footer Info -->
  <g transform="translate(550, 470)" text-anchor="middle">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" fill="#756f96">
      Fully autonomous lifecycle • Non-blocking async execution • Customizable sound alerts
    </text>
  </g>
</svg>

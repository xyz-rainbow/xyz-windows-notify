<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090714"/>
      <stop offset="50%" stop-color="#120c24"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#9b51e0"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f183b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#110c22" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200"/>
    <path d="M100,0 V420 M200,0 V420 M300,0 V420 M400,0 V420 M500,0 V420 M600,0 V420 M700,0 V420 M800,0 V420 M900,0 V420 M1000,0 V420 M1100,0 V420"/>
  </g>

  <!-- Ambient Glowing Blobs -->
  <circle cx="150" cy="120" r="140" fill="#7928ca" opacity="0.25" filter="url(#glow)"/>
  <circle cx="950" cy="200" r="160" fill="#00f2fe" opacity="0.15" filter="url(#glow)"/>

  <!-- Left Column: Branding & Info -->
  <g transform="translate(80, 75)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#20153d" stroke="url(#cyanPurple)" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="5" fill="#00f2fe"/>
    <text x="28" y="20" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#00f2fe" letter-spacing="1">WINDOWS 10 &amp; 11 COMPATIBLE</text>
    <text x="225" y="20" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#a49ecc">v1.2.0</text>

    <!-- Main Title -->
    <text x="0" y="75" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="46" fill="url(#primaryGrad)" filter="url(#glow)">XYZ-WINDOWS-NOTIFY</text>

    <!-- Tagline & Description -->
    <text x="0" y="118" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="20" fill="#ffffff">Smart Windows Toast Notifications for AI Agents</text>
    <text x="0" y="150" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="14.5" fill="#a49ecb">
      Universal Windows support (10 &amp; 11) • Bundled &amp; AI-Generated Icons • Real-Time Progress (%)
    </text>

    <!-- Highlights Badges -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#18122d" stroke="#372c5c" stroke-width="1"/>
      <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#00f2fe">🦄 Bundled Branding</text>

      <rect x="175" y="0" width="170" height="34" rx="8" fill="#18122d" stroke="#372c5c" stroke-width="1"/>
      <text x="189" y="22" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c77dff">🤖 AI Icon Resolver</text>

      <rect x="355" y="0" width="170" height="34" rx="8" fill="#18122d" stroke="#372c5c" stroke-width="1"/>
      <text x="369" y="22" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#ff007f">📊 Real-Time % Bars</text>
    </g>

    <!-- Terminal Command Snippet -->
    <g transform="translate(0, 232)">
      <rect x="0" y="0" width="525" height="36" rx="8" fill="#0c0917" stroke="#2c224d" stroke-width="1"/>
      <text x="14" y="23" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" fill="#00f2fe">npx</text>
      <text x="44" y="23" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" fill="#ffffff">skills add xyz-rainbow/xyz-windows-notify</text>
    </g>
  </g>

  <!-- Right Column: Windows Toast Mockup -->
  <g transform="translate(680, 65)" filter="url(#cardShadow)">
    <!-- Main Toast Box -->
    <rect width="440" height="290" rx="18" fill="url(#cardGrad)" stroke="url(#cyanPurple)" stroke-width="1.8"/>

    <!-- Toast Header (Windows Action Center App Identity) -->
    <g transform="translate(24, 24)">
      <circle cx="10" cy="10" r="10" fill="#ff007f"/>
      <path d="M7 10 L9.5 12.5 L13.5 7.5" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="14" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#c77dff">AI Agent Notification</text>
      <text x="360" y="14" font-family="'Segoe UI', sans-serif" font-size="11" fill="#756f96">just now</text>
    </g>

    <!-- App Logo / Icon Box -->
    <g transform="translate(24, 60)">
      <rect width="64" height="64" rx="14" fill="url(#accentGrad)"/>
      <!-- Unicorn / Magic Wand Silhouette -->
      <path d="M32 18 L36 30 L48 34 L38 42 L42 54 L32 46 L22 54 L26 42 L16 34 L28 30 Z" fill="#ffffff" opacity="0.95"/>
      <circle cx="48" cy="18" r="4" fill="#00f2fe"/>
      <circle cx="16" cy="22" r="2.5" fill="#00f2fe"/>
    </g>

    <!-- Notification Texts -->
    <g transform="translate(102, 75)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#ffffff">🚀 Backup Progress: 75%</text>
      <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="13" fill="#b8b3d6">1,575 MB of 2,100 MB transferred</text>
      <text x="0" y="44" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="12" fill="#7d78a1">Syncing Kindle &amp; Calibre library to D:\</text>
    </g>

    <!-- Interactive Progress Bar -->
    <g transform="translate(24, 155)">
      <rect width="392" height="8" rx="4" fill="#261d47"/>
      <rect width="294" height="8" rx="4" fill="url(#primaryGrad)"/>
    </g>

    <!-- Footer Action Buttons & Audio Badge -->
    <g transform="translate(24, 185)">
      <rect x="0" y="0" width="120" height="32" rx="7" fill="#2d2254" stroke="#4c3b88" stroke-width="1"/>
      <text x="60" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">View Details</text>

      <rect x="130" y="0" width="100" height="32" rx="7" fill="#1b1435" stroke="#32265c" stroke-width="1"/>
      <text x="180" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#a49ecc" text-anchor="middle">Dismiss</text>

      <g transform="translate(320, 10)">
        <path d="M0 4 L4 4 L9 0 L9 14 L4 10 L0 10 Z" fill="#00f2fe"/>
        <path d="M12 2 Q15 7 12 12" stroke="#00f2fe" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <text x="20" y="10" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#00f2fe">Chime</text>
      </g>
    </g>

    <!-- Sub-status -->
    <g transform="translate(24, 245)">
      <rect width="392" height="28" rx="6" fill="#130e26"/>
      <circle cx="16" cy="14" r="4" fill="#00ff87"/>
      <text x="28" y="18" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#a9a3cc">Icon resolved from: <tspan fill="#00ff87">assets/icons/unicorn.jpg</tspan></text>
    </g>
  </g>
</svg>
